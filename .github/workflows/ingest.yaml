name: Weekly Football Data Ingestion & Model Retraining

on:
  schedule:
    # Runs Mondays at 23:00 UTC and Thursdays at 02:00 UTC
    - cron: '0 23 * * 1'
    - cron: '0 2 * * 4'
  workflow_dispatch:

# Ensures the Action has permission to push the new models to your repo
permissions:
  contents: write

jobs:
  ingest_and_train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy catboost scikit-learn mlflow

      - name: 1. Run Data Ingestion (All Leagues)
        # Your ingest.py already loops through both leagues internally
        run: python src/ingest.py

      - name: 2. Run Feature Engineering (EPL)
        run: python src/update_features.py --league EPL
        
      - name: 3. Run Feature Engineering (La Liga)
        run: python src/update_features.py --league LaLiga

      - name: 4. Retrain Models (EPL)
        run: python src/train.py --league EPL
        
      - name: 5. Retrain Models (La Liga)
        run: python src/train.py --league LaLiga

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Add the SQLite databases (Data & MLflow Tracking)
          git add -f data/football_data.db
          git add -f data/mlflow.db
          
          # Add the newly generated training data for both leagues
          git add data/X_train_epl.csv data/y_train_epl.csv
          git add data/X_train_laliga.csv data/y_train_laliga.csv
          
          # Add all newly trained models
          git add model/
          
          # Commit and push (will trigger Render to deploy the new models!)
          git commit -m "Auto-update multi-league data and retrain models [skip ci]" || exit 0
          git push