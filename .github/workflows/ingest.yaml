name: Weekly Football Data Ingestion

on:
  schedule:
    # Runs Mondays at 23:00 UTC and Thursdays at 02:00 UTC
    - cron: '0 23 * * 1'
    - cron: '0 2 * * 4'
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Ingestion Script
        # We tell it to run the script from the src folder
        run: python src/ingest.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/football_data.db
          git commit -m "Auto-update raw match database [skip ci]" || exit 0
          git push