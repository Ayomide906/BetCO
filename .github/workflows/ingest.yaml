name: Weekly Football Data Ingestion & Model Retraining

on:
  schedule:
    # Runs Mondays at 23:00 UTC and Thursdays at 02:00 UTC
    - cron: '0 23 * * 1'
    - cron: '0 2 * * 4'
  workflow_dispatch:

# Ensures the Action has permission to push the new models to your repo
permissions:
  contents: write

jobs:
  ingest_and_train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # Installs all required libraries for feature engineering and CatBoost training
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy catboost scikit-learn mlflow

      - name: 1. Run Data Ingestion
        run: python src/ingest.py

      - name: 2. Run Feature Engineering
        # Assumes you saved the first script above as update_features.py
        run: python src/update_features.py

      - name: 3. Retrain Models
        run: python src/train.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Add the updated database
          git add data/football_data.db
          
          # Add the newly generated training data
          git add data/X_train.csv data/y_train.csv
          
          # Add the newly trained models
          git add model/
          
          # Commit and push (will trigger Render to deploy the new models!)
          git commit -m "Auto-update data and retrain models [skip ci]" || exit 0
          git push